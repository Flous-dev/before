function mimesLaunch(){ mimes.manche=0; mimes.scores={}; mimes.turn=0; mimes.order=null; mimesOrdre(); mimesTurnIntro(); }
function mimesNewRound(){ mimes.manche++; mimes.scores={}; mimes.turn=0; mimesOrdre(); mimesTurnIntro(); }

/* ---------- ordre de passage ----------
   Il change à chaque manche, et jamais le dernier d'une manche ne rouvre
   la suivante : sinon la même personne enchaîne deux tours de suite. */
function mimesOrdre(){
  const n = (mimes.format==='team' && mimes.teams) ? mimes.teams.length : state.players.length;
  const dernier = (mimes.order && mimes.order.length===n) ? mimes.order[n-1] : null;
  const base=[]; for(let i=0;i<n;i++) base.push(i);
  let o=shuffle(base);
  for(let k=0; k<40 && n>1 && dernier!==null && o[0]===dernier; k++) o=shuffle(base);
  mimes.order=o;
}

/* qui joue, dans quel ordre : recalculé à chaque fois, l'ordre reste stable */
function mimesEnts(){
  if(mimes.format==='team' && mimes.teams && mimesTeamsOk()){
    const base=mimes.teams.map((t,i)=>{
      // à chaque manche les rôles s'inversent dans l'équipe ; « inverser » force le contraire
      const d=(mimes.manche+(mimes.swap[i]?1:0))%2;
      return { key:'t'+i, idx:i, label:t[0]+' & '+t[1], membres:t.slice(),
               devine:t[d], mimeurs:[t[1-d]] };
    });
    return mimesRange(base);
  }
  return mimesRange(state.players.map((p,i)=>({
    key:'p'+i, idx:i, label:p.name, membres:[p.name], devine:p.name,
    mimeurs:state.players.filter(x=>x.name!==p.name).map(x=>x.name) })));
}
function mimesRange(base){
  if(!mimes.order || mimes.order.length!==base.length) mimesOrdre();
  return mimes.order.map(i=>base[i]).filter(Boolean);
}
function mimesSwap(){
  const e=mimesEnts()[mimes.turn]; if(!e) return;
  mimes.swap[e.idx]=!mimes.swap[e.idx];
  mimesTurnIntro();
}

/* ---------- passation du téléphone ---------- */

  render(`

      <div class="gap-s"></div>

      <div class="gap-s"></div>

      <div class="gap-s"></div>
      <div class="row"><span style="font-size:21px">😌</span><span style="font-size:13.5px">Entre deux mots, remets le téléphone droit : c'est ce qui réarme la détection.</span></div>

function mimesGo(){
  mimeAudioUnlock();   // doit partir d'un vrai geste : c'est le cas ici
  const DM=window.DeviceMotionEvent;
  if(DM && typeof DM.requestPermission==='function'){
    // iOS 13+ : l'autorisation se demande depuis le geste, pas après
    DM.requestPermission()
      .then(r=>{ mimes.tilt=(r==='granted'); mimesCountdown(); })
      .catch(()=>{ mimes.tilt=false; mimesCountdown(); });
  }else{
    mimes.tilt=!!DM;
    mimesCountdown();
  }
}

/* ---------- 3 · 2 · 1 ---------- */
function mimesCountdown(){
  mimeOn(true);
  mimes.rotLock=false;               // le décompte sert à trouver le sens ET la position de repos
  mimeTiltReset();
  if(mimes.tilt) window.addEventListener('devicemotion',onMimeMotion);
  window.addEventListener('resize',mimeFit);
  window.addEventListener('orientationchange',mimeFit);
  let k=3;
  const paint=()=>{
    const l=$('#mimelayer'); if(!l) return;
    l.innerHTML=`<div class="mimescreen"><div class="mimeword"><div class="mimeverdict">${k>0?k:'GO !'}
      <small>${k>0?'Téléphone à l\'horizontale, sur ton front':'Le premier mot arrive'}</small></div></div></div>`;
    mimeFit();
  };
  paint(); mimeBip(520,.12);
  clearInterval(mimes.cd);
  mimes.cd=setInterval(()=>{
    k--;
    if(k<0){ clearInterval(mimes.cd); mimesPlay(); return; }
    paint();
    mimeBip(k>0?520:880,k>0?.12:.22);
  },900);
}

/* ---------- la manche ---------- */
function mimesPlay(){
  mimes.rotLock=true;                // à partir d'ici l'écran ne bouge plus jusqu'à la fin du tour
  mimes.log=[]; mimes.running=true; mimes.armed=false; mimes.flash=false;
  mimes.tiltDir=0; mimes.tiltSince=0;
  mimes.lastAct=0; mimes.lastSec=-1; mimes.gotMotion=false;
  mimes.tap=!mimes.tilt;
  // ceux qui devinent ce tour-ci : leurs private jokes sont mises de côté
  const e=mimesEnts()[mimes.turn], noms=state.players.map(p=>p.name);
  mimes.exclus = e ? e.membres.filter(n=>noms.indexOf(n)>=0) : [];
  mimes.word=drawMime(mimes.exclus);
  mimes.endAt=Date.now()+mimes.duree*1000;
  paintMime();
  clearInterval(mimes.timer);
  mimes.timer=setInterval(mimesTick,90);
  if(mimes.tilt) window.addEventListener('devicemotion',onMimeMotion);   // déjà posé au décompte, sans doublon
  // capteur muet (ordinateur, autorisation fantôme) → on ouvre les zones tactiles
  clearTimeout(mimes.fallback);
  mimes.fallback=setTimeout(()=>{
    if(mimes.running && !mimes.gotMotion && !mimes.tap){ mimes.tap=true; paintMime(); }
  },2600);
  mimeWakeOn();
}
function paintMime(){
  const l=$('#mimelayer'); if(!l) return;
  const ok=mimes.log.filter(x=>x.ok).length, no=mimes.log.length-ok;
  const left=Math.max(0,mimes.endAt-Date.now());
  l.innerHTML=`
    <div class="mimescreen" id="mimeScreen">
      <div class="mimequit" onclick="mimesAbort()">✕</div>
      <div class="mimetop">
        <div class="sc ok">✅ ${ok}</div>
        <div class="mimetime" id="mimeTime">${Math.ceil(left/1000)}</div>
        <div class="sc no">⏭ ${no}</div>
      </div>
      <div class="mimebar" id="mimeBar"><i style="width:${left/(mimes.duree*10)}%"></i></div>
      <div class="mimeword" id="mimeWord"><div>${mimes.word.w}${mimes.word.by
        ? `<span class="mimeby">🔒 la joke de ${mimes.word.by}</span>` : ''}</div></div>
      <div class="mimehints">
        <div class="mimehint no">⬆️ ${mimes.tap?'Touche le haut':'Relève et tiens'} · Passer</div>
        <div class="mimehint ok">⬇️ ${mimes.tap?'Touche le bas':'Penche et tiens'} · Trouvé</div>
      </div>
      <div class="mimetap no" onclick="mimesTap(false)"></div>
      <div class="mimetap ok" onclick="mimesTap(true)"></div>
    </div>`;
  mimeFit();
}
function mimesTick(){
  if(!mimes.running) return;
  const left=mimes.endAt-Date.now();
  const s=Math.max(0,Math.ceil(left/1000));
  const el=$('#mimeTime'); if(el){ el.textContent=s; el.classList.toggle('hot',s<=5); }
  const bar=$('#mimeBar');
  if(bar){
    bar.classList.toggle('hot',s<=5);
    const i=bar.firstElementChild;
    if(i) i.style.width=Math.max(0,Math.min(100,left/(mimes.duree*10)))+'%';
  }
  if(s!==mimes.lastSec){ mimes.lastSec=s; if(s>0&&s<=5) mimeBip(760,.09,'square',.18); }
  if(left<=0) mimesEndTurn();
}
/* ---------- lecture de l'inclinaison ----------
   Posé sur un front, le téléphone n'est jamais immobile : la tête tourne, les
   bras fatiguent, le porteur rigole. Un simple seuil validait donc des mots
   tout seul. Quatre garde-fous, dans l'ordre :
     1. un filtre passe-bas sur la gravité — le tremblement disparaît ;
     2. un zéro pris pendant le décompte : on mesure l'écart à SA position à
        lui, pas à une verticale théorique que personne ne tient ;
     3. un seuil franc : 48° d'écart, mesurés en degrés et non en projection,
        pour que pencher vers l'avant et relever demandent le même geste ;
     4. une tenue de 150 ms à ce seuil, hors secousse : un à-coup ne suffit pas.
   Et après chaque mot il faut revenir près de la position de départ pour
   réarmer — impossible d'enchaîner deux validations sans repasser par là. */
const MIME_TILT = { fire:48, rearm:22, hold:150, lisse:.26, calme:4 };
function mimeTiltReset(){
  mimes.g=null; mimes.zero=0; mimes.armed=false; mimes.tiltDir=0; mimes.tiltSince=0;
}
function onMimeMotion(ev){
  const a=ev.accelerationIncludingGravity; if(!a) return;
  const x=a.x||0, y=a.y||0, z=a.z||0;
  const m=Math.sqrt(x*x+y*y+z*z);
  if(m<4||m>19) return;              // chute libre ou grosse secousse : la gravité est illisible
  mimes.gotMotion=true;
  const k=MIME_TILT.lisse;           // filtre passe-bas : on suit la gravité, pas les vibrations
  if(!mimes.g) mimes.g={x:x/m, y:y/m, z:z/m};
  else { const p=mimes.g; p.x+=k*(x/m-p.x); p.y+=k*(y/m-p.y); p.z+=k*(z/m-p.z); }
  const g=mimes.g, gm=Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z)||1;
  const nx=g.x/gm, nz=g.z/gm;        // nz : -1 = écran vers le sol · +1 = écran vers le ciel
  const angle = -Math.asin(Math.max(-1,Math.min(1,nz)))*57.29578;   // degrés · + = penché vers l'avant

  /* Avant le GO : on cherche le sens de lecture et on retient la position de
     repos. On ne lit le sens que quand l'écran est à peu près vertical — passé
     la verticale, un mouvement vers l'avant inverse le signe de nx et
     retournerait l'écran alors que le téléphone n'a pas bougé de main. */
  if(!mimes.rotLock){
    if(Math.abs(nz)<.4 && Math.abs(nx)>.6){
      const dir = nx>0 ? 1 : -1;
      if(dir!==mimes.rotDir){ mimes.rotDir=dir; mimeFit(); }
    }
    mimes.zero = Math.max(-20, Math.min(20, angle));   // sa position à lui, sur son front
    return;
  }

  const t=Date.now();
  const ecart = angle - mimes.zero;  // écart à la position de départ, pas à une verticale théorique
  if(!mimes.armed){                  // il faut revenir en position avant le mot suivant
    if(Math.abs(ecart)<MIME_TILT.rearm){ mimes.armed=true; mimes.tiltDir=0; }
    return;
  }
  const secousse = Math.abs(m-9.81)>MIME_TILT.calme;
  const dir = ecart>=MIME_TILT.fire ? 1 : (ecart<=-MIME_TILT.fire ? -1 : 0);
  if(!dir || secousse){ mimes.tiltDir=0; return; }
  if(mimes.tiltDir!==dir){ mimes.tiltDir=dir; mimes.tiltSince=t; return; }
  if(t-mimes.tiltSince>=MIME_TILT.hold){    // tenu assez longtemps : c'est un vrai geste
    mimes.armed=false; mimes.tiltDir=0;
    mimesHit(dir>0);
  }
}
function mimesTap(ok){ if(mimes.tap) mimesHit(ok); }
function mimesHit(ok){
  const t=Date.now();
  if(!mimes.running || mimes.flash || t-mimes.lastAct<400) return;
  mimes.lastAct=t; mimes.flash=true;
  const mot=mimes.word;
  mimes.log.push({w:mot.w, by:mot.by, ok});
  mimeDing(ok);
  const sc=$('#mimeScreen'), w=$('#mimeWord');
  if(sc) sc.classList.add(ok?'ok':'no');
  if(w) w.innerHTML=`<div class="mimeverdict">${ok?'TROUVÉ ✅':'PASSÉ ⏭'}<small>${mot.w}</small></div>`;
  setTimeout(()=>{
    mimes.flash=false;
    if(!mimes.running) return;
    mimes.word=drawMime(mimes.exclus);
    paintMime();
  },560);
}
function mimesStop(){
  mimes.running=false;
  clearInterval(mimes.timer); clearInterval(mimes.cd); clearTimeout(mimes.fallback);
  window.removeEventListener('devicemotion',onMimeMotion);
  window.removeEventListener('resize',mimeFit);
  window.removeEventListener('orientationchange',mimeFit);
  mimeWakeOff();
}
function mimesAbort(){
  mimesStop(); mimeOn(false);
  toast('Tour annulé');

}
function mimesEndTurn(){
  mimesStop(); mimeBuzz(); mimeOn(false);
  const e=mimesEnts()[mimes.turn];
  if(e) mimes.scores[e.key]=mimes.log.filter(x=>x.ok).length;
  mimesRecap();
}

/* ---------- récap du tour, corrigeable ---------- */
function mimeLogHTML(){
  return mimes.log.map((x,i)=>`<div class="wchip${x.ok?' ok':''}" onclick="mimesFix(${i})">${x.ok?'✅':'⏭'} ${x.w}</div>`).join('');
}
function mimesFix(i){
  const x=mimes.log[i]; if(!x) return;
  x.ok=!x.ok;
  const e=mimesEnts()[mimes.turn];
  const pts=mimes.log.filter(y=>y.ok).length;
  if(e) mimes.scores[e.key]=pts;
  const lg=$('#mimeLog'); if(lg) lg.innerHTML=mimeLogHTML();
  const p=$('#mimePts'); if(p) p.textContent=pts;
  const s=$('#mimePtsSub'); if(s) s.textContent=mimePtsSub(pts);
}
function mimePtsSub(pts){
  const n=mimes.log.length;
  return `mot${pts>1?'s':''} trouvé${pts>1?'s':''} sur ${n} tiré${n>1?'s':''}`;
}
function mimesRecap(){
  const ents=mimesEnts(), e=ents[mimes.turn];

/* ---------- classement de la manche : le dernier paie ---------- */
function listeFr(a){ return a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' & '+a[a.length-1]; }
function sanctionGroupe(noms,n){
  const v = sansAlcool() ? (noms.length>1?'prennent':'prend') : (noms.length>1?'boivent':'boit');
  return `${listeFr(noms)} ${v} ${unite(n)}`;
}
function mimesResults(){
  compteManche('mimes');
  const rows=mimesEnts().map(e=>Object.assign({},e,{pts:mimes.scores[e.key]||0}))
                        .sort((a,b)=>b.pts-a.pts);
  const min=rows[rows.length-1].pts;
  const perdants=rows.filter(r=>r.pts===min);
  const egalite=perdants.length===rows.length;
  /* Avec alcool : le perdant boit autant de gorgées qu'il a deviné de mots — moins il
     en trouve, moins il boit, mais il boit toujours au moins un coup. Sans alcool on
     garde l'échelle des gages (1 à 3), sinon le niveau du défi n'aurait plus de sens :
     zéro mot trouvé = gage costaud. Égalité générale : tout le monde trinque un coup. */
  const n = egalite ? 1
          : sansAlcool() ? (min===0 ? 3 : 2)
          : Math.max(1,min);
  const punis=[];
  perdants.forEach(r=>r.membres.forEach(m=>{ addDrinks(m,n); punis.push([m,n]); }));
  const noms=punis.map(p=>p[0]);
  const gages = sansAlcool() && punis.length;
  if(gages) _suite = gagesAfter(punis, mimesReplay, 'mimes');
  render(`
    <div class="topbar"><h2 style="margin:auto">🎭 Fin de la manche</h2></div>
    ${counterBar()}
    <div class="gap"></div>
    ${rows.map((r,i)=>`
      <div class="rank${i<3?' p'+(i+1):''}">
        <div class="pos">${['🥇','🥈','🥉'][i]||i+1}</div>
        <div class="rank__id"><h3>${r.label}</h3>${(!egalite&&r.pts===min)?'<div class="rank__t">💀 le maillon faible de la manche</div>':''}</div>
        <div class="g">${r.pts} 🎭</div>
      </div>`).join('')}
    <div class="gap"></div>
    <div class="card tint-coral center">
      <p style="font-size:16px;font-weight:750">${egalite
        ? `Égalité parfaite — ${sanctionGroupe(noms,n)} 😐`
        : sanctionGroupe(noms,n)}</p>
      ${egalite ? '' : sansAlcool()
        ? (min===0 ? `<div class="gap-s"></div><p class="muted">Zéro mot trouvé : la sanction est majorée.</p>` : '')
        : `<div class="gap-s"></div><p class="muted">Une gorgée par mot deviné${min===0?' — et un coup minimum, même à zéro':''}.</p>`}
    </div>
    <div class="spacer"></div>
    ${gages
      ? `<button class="btn good" onclick="suivreResultat()">Passer aux gages 🔥 →</button>`
      : `<button class="btn good" onclick="mimesNewRound()">↻ Nouvelle manche</button>
         <div class="gap-s"></div>
         <button class="btn ghost sm" onclick="mimesConfig()">⚙️ Changer les réglages</button>
         <div class="gap-s"></div>
         <button class="btn ghost sm" onclick="gameSelect()">Changer de jeu</button>`}
    <div style="height:8px"></div>
  `, true);
}

  render(`

function classer(list,mode){
  // mode alcool : le plus grand buveur en tête. Mode sans alcool : le meilleur solde
  // de 🔥, et à égalité c'est celui qui a le moins refusé qui passe devant.
  return [...(list||[])].sort(mode==='sans'
    ? (a,b)=>((b.reussis||0)-(a.reussis||0)) || ((a.refus||0)-(b.refus||0))
    : (a,b)=>(b.drinks||0)-(a.drinks||0));
}
// petit titre décerné à chaque joueur en mode sans alcool
function titreGage(rang,pts,degonf){
  if(!pts && !degonf) return 'est resté·e bien au chaud';
  if(pts<0)           return '🙅 dans le rouge';
  if(!pts)            return '😐 autant relevé que refusé';
  if(rang===0)        return '👑 boss des gages';
  if(degonf)          return '🙂 a reculé une fois ou deux';
  if(rang===1)        return '🔥 casse-cou';
  if(rang===2)        return '😎 solide';
  return '💪 n\'a jamais reculé';
}
function rankingList(){ return rankingListFrom(classer(state.players,state.mode),state.mode); }
function rankingListFrom(list,mode='alcool'){
  const sober = mode==='sans', medals=['🥇','🥈','🥉'];
  if(!list || !list.length) return '<p class="muted">Aucun joueur.</p>';
  const legende = sober
    ? `<p class="muted" style="font-size:12.5px;margin:0 0 10px">🔥 = gages relevés moins gages refusés. Reculer coûte autant que relever rapporte : le compteur peut passer sous zéro.</p>`
    : '';
  return legende + list.map((p,i)=>{
    const pts=sober?(p.reussis||0):(p.drinks||0);
    const degonf=sober?(p.refus||0):0;
    return `<div class="rank${i<3?' p'+(i+1):''}">
      <div class="pos">${medals[i]||i+1}</div>
      <div class="rank__id"><h3>${p.name}</h3>${sober?`<div class="rank__t">${titreGage(i,pts,degonf)}</div>`:''}</div>
      <div class="g">${pts} ${sober?'🔥':'🍺'}</div></div>`;
  }).join('');
}
/* ---------- statistiques de fin de soirée ---------- */
function dureeTxt(ms){
  if(!ms || ms<0) return '—';
  const min=Math.round(ms/60000);
  if(min<1)  return 'moins d\'une minute';
  if(min<60) return min+' min';
  return Math.floor(min/60)+' h '+String(min%60).padStart(2,'0');
}
// le/les joueur·s en tête (ou en queue) sur un critère ; null si le critère n'a jamais servi
function extreme(list,val,sens){
  if(!list || !list.length) return null;
  const v=list.map(val);
  const cible = sens==='min' ? Math.min(...v) : Math.max(...v);
  return { noms:list.filter((_,i)=>v[i]===cible).map(p=>p.name), val:cible };
}
function nomsCourts(noms){
  return noms.length<=2 ? noms.join(' & ') : noms.slice(0,2).join(', ')+' +'+(noms.length-2);
}
function tuile(label,ex,phrase){
  if(!ex) return '';
  return `<div class="stat"><div class="stat__l">${label}</div>
    <div class="stat__v">${nomsCourts(ex.noms)}</div>
    <div class="stat__s">${phrase(ex.val,ex.noms.length>1)}</div></div>`;
}
function statsBlock(a){
  const list=a.ranking||[]; if(!list.length) return '';
  const sober=(a.mode||'alcool')==='sans';
  const st=a.stats||{};
  const u=n=>sober?`${n} gage${n>1?'s':''}`:`${n} gorgée${n>1?'s':''}`;
  const e=sober?'':'e';                    // « gages » masculin, « gorgées » féminin
  const acc=(part,n)=>`${part}${e}${n>1?'s':''}`;
  const exaequo=m=>m?' (ex æquo)':'';

  const mvp     = sober ? extreme(list,p=>p.reussis||0,'max') : extreme(list,p=>p.drinks||0,'min');
  const victime = extreme(list,p=>p.subies||0,'max');
  const distrib = extreme(list,p=>p.donnees||0,'max');
  const perdant = extreme(list,p=>p.defaites||0,'max');

  const total   = list.reduce((s,p)=>s+(sober?(p.reussis||0):(p.drinks||0)),0);
  const encaisse= list.reduce((s,p)=>s+(p.subies||0),0);
  // les manches restent comptées et enregistrées dans l'album, mais ne sont plus
  // affichées : ça faisait trop de lignes après le classement.
  return `
    <h3>📊 Les chiffres de la soirée</h3>
    <div class="gap-s"></div>
    <div class="stats">
      ${tuile('🏅 MVP de la soirée', mvp,
              (v,eq)=>sober?`${v} 🔥 au compteur${exaequo(eq)}`:`${u(v)} seulement${exaequo(eq)}`)}
      ${victime && victime.val>0 ? tuile('🩹 Victime de la soirée', victime,
              (v,eq)=>`${u(v)} ${acc('encaissé',v)}${exaequo(eq)}`) : ''}
      ${distrib && distrib.val>0 ? tuile('🎯 Plus grand distributeur', distrib,
              (v,eq)=>`${u(v)} ${acc('infligé',v)} aux autres${exaequo(eq)}`) : ''}
      ${perdant && perdant.val>0 ? tuile('💀 Plus grand perdant', perdant,
              (v,eq)=>`${v} fois sanctionné·e${exaequo(eq)}`) : ''}
    </div>
    <div class="gap"></div>
    <div class="statline"><span>${sober?'🔥':'🍺'}</span>
      <span>${sober?'Solde de 🔥 du groupe':'Total bu par le groupe'}</span><b>${total}</b></div>
    ${sober?`<div class="statline"><span>🎲</span><span>Gages tirés en tout</span><b>${encaisse}</b></div>`:''}
    ${st.duree>0?`<div class="statline"><span>⏱️</span><span>Durée de la soirée</span><b>${dureeTxt(st.duree)}</b></div>`:''}
  `;
}

/* ---------- helpers AFTER ---------- */
function afterCityVenues(){ return CITIES[state.after.city].venues; }
function fmtHour(h){ return (h===0?'minuit':h+'h'); }
function fmtDist(km){ return km<1 ? Math.round(km*1000)+' m' : String(km).replace('.',',')+' km'; }
function fmtDur(min){ const h=Math.floor(min/60),m=min%60; return h?`${h}h${m?String(m).padStart(2,'0'):''}`:`${m} min`; }

/* statut d'ouverture calculé sur l'heure réelle du téléphone */
function venueStatus(v){
  const now=new Date(), cur=now.getHours()*60+now.getMinutes();
  const o=v.open*60, c=v.close*60;
  const isOpen = (c<=o) ? (cur>=o||cur<c) : (cur>=o&&cur<c);
  if(isOpen){
    let left=(c-cur+1440)%1440; if(left===0) left=1440;
    return left<=60
      ? {open:true,cls:'st-soon',txt:`Ferme dans ${fmtDur(left)}`}
      : {open:true,cls:'st-open',txt:`Ouvert jusqu'à ${fmtHour(v.close)}`};
  }
  return {open:false,cls:'st-closed',txt:`Ouvre à ${fmtHour(v.open)}`};
}

function afterVenues(){
  const f=state.after;
  let list=afterCityVenues().filter(v=>{
    if(f.type!=='all' && v.type!==f.type) return false;
    if(f.theme!=='all' && !v.themes.includes(f.theme)) return false;
    if(f.price!=='all' && String(v.price)!==f.price) return false;
    if(f.openOnly==='open' && !venueStatus(v).open) return false;
    return true;
  });
  const s=f.sort;
  list.sort((a,b)=> s==='rating' ? b.rating-a.rating
                  : s==='price'  ? (a.price-b.price)||(a.entry+a.drink)-(b.entry+b.drink)
                  : a.dist-b.dist);
  return list;
}
